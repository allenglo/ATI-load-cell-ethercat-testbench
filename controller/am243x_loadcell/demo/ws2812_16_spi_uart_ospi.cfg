# UART flash config for AM243x-LP WS2812 (SPI-encoded) demo

--flash-writer=sbl_prebuilt/am243x-lp/sbl_uart_uniflash.release.hs_fs.tiimage

--operation=flash-phy-tuning-data

# Program OSPI SBL at flash offset 0x0
--file=sbl_prebuilt/am243x-lp/sbl_ospi.release.hs_fs.tiimage --operation=flash --flash-offset=0x0

# Program app image at flash offset 0x80000
--file=../../examples/drivers/mcspi/mcspi_loopback/am243x-lp/r5fss0-0_nortos/ti-arm-clang/mcspi_loopback.release.mcelf.hs_fs --operation=flash --flash-offset=0x80000

# Program XIP metadata
--file=../../examples/drivers/mcspi/mcspi_loopback/am243x-lp/r5fss0-0_nortos/ti-arm-clang/mcspi_loopback.release.mcelf_xip --operation=flash-mcelf-xip
